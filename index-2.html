<style>
  :root{
    color-scheme: dark;
    --bg:#0A0D12;
    --card:#151A23;
    --card-hi:#19212C;
    --key:#1B222D;
    --key-press:#2B3543;
    --stroke:rgba(255,255,255,.07);
    --accent:#2DD4A7;
    --accent-soft:rgba(45,212,167,.13);
    --accent-ink:#04231B;
    --text:#E9EFF6;
    --muted:#79879A;
    --warn:#F6C177;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
    touch-action:manipulation;font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #app{height:100%;display:flex;flex-direction:column;gap:9px;padding:9px 9px 4px}

  /* ---------- panels ---------- */
  .stack{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:9px;position:relative}
  .panel{
    flex:1 1 0;min-height:0;background:var(--card);border-radius:22px;
    display:flex;flex-direction:column;justify-content:center;gap:8px;
    padding:12px 16px;position:relative;overflow:hidden;
    transition:background .15s, box-shadow .15s;
  }
  .panel.active{background:var(--card-hi);box-shadow:inset 0 0 0 1.5px rgba(45,212,167,.3)}
  .cur{
    align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
    padding:6px 11px 6px 6px;border-radius:999px;background:rgba(255,255,255,.055);
    transition:transform .07s, background .12s;
  }
  .cur:active{transform:scale(.96);background:rgba(255,255,255,.1)}
  .flag{
    width:27px;height:27px;border-radius:50%;overflow:hidden;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;background:#E8EDF3;
    font-size:23px;line-height:1;
    font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  }
  .cur .code{font-size:15px;font-weight:600;letter-spacing:.05em}
  .chev{width:15px;height:15px;stroke:var(--muted);stroke-width:2.4;margin-left:-2px}
  .val{display:flex;align-items:center;justify-content:flex-end;gap:9px;min-width:0}
  .eq{font-size:23px;color:var(--muted);flex:0 0 auto;visibility:hidden;font-weight:300}
  .val.result .eq{visibility:visible}
  .num{font-size:44px;font-weight:350;white-space:nowrap;overflow:hidden;max-width:100%;line-height:1.1}
  .num.s2{font-size:36px}
  .num.s3{font-size:29px}
  .num.s4{font-size:23px}
  .caret{display:inline-block;width:2.5px;height:.92em;border-radius:2px;background:var(--accent);
         margin-left:4px;vertical-align:-.1em;animation:blink 1.1s steps(1,end) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.caret{animation:none}*{transition:none !important}}

  #swapFab{
    position:absolute;top:50%;right:14px;transform:translateY(-50%);
    width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;z-index:3;
    box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .12s;
  }
  #swapFab svg{width:21px;height:21px;stroke-width:2.3}
  #swapFab:active{transform:translateY(-50%) scale(.9)}

  /* ---------- keypad ---------- */
  .keys{
    flex:2.02 1 0;min-height:0;display:grid;
    grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:8px;
  }
  .k{
    background:var(--key);border-radius:19px;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:450;transition:transform .07s, background .12s, filter .12s;
  }
  .k:active{transform:scale(.94);background:var(--key-press)}
  .k.fn{background:transparent;box-shadow:inset 0 0 0 1.4px var(--stroke);color:var(--muted);font-size:21px}
  .k.fn:active{background:rgba(255,255,255,.05)}
  .k.op{background:var(--accent-soft);color:var(--accent);font-size:27px;font-weight:500}
  .k.eq{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .k svg{width:23px;height:23px}

  /* ---------- status bar ---------- */
  .bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:2px 2px 2px}
  .bar button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:0 0 auto;color:var(--muted)}
  .bar button:active{background:rgba(255,255,255,.07)}
  .bar svg{width:20px;height:20px;stroke-width:1.9}
  .rateWrap{flex:1 1 auto;min-width:0;text-align:center;padding:3px 0}
  #rateLine{font-size:15px;color:#D2DCE8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #rateAge{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;justify-content:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  #rateAge.live .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(45,212,167,.16)}
  #rateAge.live{color:var(--accent)}
  #rateAge.warn .dot{background:var(--warn)}
  #rateAge.warn{color:var(--warn)}
  #rateAge.custom .dot{background:#8AB4F8}
  #rateAge.custom{color:#8AB4F8}
  .spin{animation:spin .9s linear infinite;transform-origin:50% 50%}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- currency picker ---------- */
  .screen{
    position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .screen.open{display:flex}
  .head{display:flex;align-items:center;padding:10px 8px 6px;flex:0 0 auto}
  .head h1{flex:1 1 auto;text-align:center;font-size:19px;font-weight:600;margin:0 44px 0 0}
  .back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .back svg{width:24px;height:24px;stroke-width:2.4}
  .searchWrap{padding:4px 14px 10px;flex:0 0 auto}
  #search{
    width:100%;height:46px;border-radius:15px;background:var(--card);border:1.4px solid transparent;
    padding:0 16px;color:var(--text);font-size:16px;-webkit-user-select:text;user-select:text;
  }
  #search::placeholder{color:var(--muted)}
  #search:focus{outline:none;border-color:var(--accent)}
  #list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 20px}
  .row{display:flex;align-items:center;gap:14px;padding:10px 12px;width:100%;text-align:left;border-radius:15px}
  .row:active{background:var(--card)}
  .row .flag{width:36px;height:36px;font-size:30px}
  .row .name{flex:1 1 auto;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .cc{font-size:14px;color:var(--muted);letter-spacing:.05em;font-weight:600;flex:0 0 auto}
  .row.pinned{background:rgba(255,255,255,.035)}
  .row.pinned .cc{color:var(--accent)}
  .row.chosen{box-shadow:inset 0 0 0 1.4px rgba(45,212,167,.35)}
  .empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:15px}
  .secLabel{padding:14px 14px 6px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

  /* ---------- sheet & dialog ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none}
  .scrim.open{display:block}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);
    border-radius:24px 24px 0 0;padding:6px 0 calc(12px + env(safe-area-inset-bottom,0px));
    transform:translateY(101%);transition:transform .2s cubic-bezier(.2,.8,.3,1);
  }
  .sheet.open{transform:translateY(0)}
  .grip{width:36px;height:4px;border-radius:2px;background:#39434F;margin:8px auto 8px}
  .item{display:flex;align-items:center;gap:14px;padding:14px 22px;width:100%;text-align:left;font-size:16px}
  .item:active{background:rgba(255,255,255,.05)}
  .item .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .item svg{width:20px;height:20px;color:var(--muted);flex:0 0 auto}
  .item .txt{flex:1 1 auto;min-width:0}
  .toggle{width:44px;height:26px;border-radius:13px;background:#39434F;position:relative;flex:0 0 auto;transition:background .15s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on{background:var(--accent)}
  .toggle.on::after{left:21px}
  .credit{padding:10px 22px 4px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
  .credit a{color:var(--muted)}
  .dlg{
    position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(340px,88vw);background:var(--card);border-radius:22px;padding:22px;display:none;
  }
  .dlg.open{display:block}
  .dlg h2{margin:0 0 6px;font-size:17px;font-weight:600}
  .dlg p{margin:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.5}
  .dlg input{
    width:100%;height:50px;border-radius:14px;background:var(--bg);border:1.4px solid var(--stroke);
    padding:0 15px;color:var(--text);font-size:19px;-webkit-user-select:text;user-select:text;
  }
  .dlg input:focus{outline:none;border-color:var(--accent)}
  .dlgBtns{display:flex;gap:9px;margin-top:16px}
  .dlgBtns button{flex:1 1 0;height:46px;border-radius:14px;background:rgba(255,255,255,.07);font-size:15px}
  .dlgBtns button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
  #toast{
    position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:#252E3A;color:var(--text);padding:12px 18px;border-radius:16px;font-size:14px;
    z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center;line-height:1.4;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1}

  @media (min-width:600px) and (min-height:560px){
    body{display:flex;align-items:center;justify-content:center;background:#05070A}
    #app{width:400px;height:min(100%,830px);border-radius:26px;box-shadow:0 20px 70px rgba(0,0,0,.7);background:var(--bg)}

["SDG","Sudanese Pound","🇸🇩",601.5],
["LYD","Libyan Dinar","🇱🇾",6.3437],
["GMD","Gambian Dalasi","🇬🇲",73.5],
["GNF","Guinean Franc","🇬🇳",8780.01],
["BIF","Burundian Franc","🇧🇮",3002.66],
["CVE","Cape Verde Escudo","🇨🇻",95.979],
["AOA","Angolan Kwanza","🇦🇴",913],
["DJF","Djiboutian Franc","🇩🇯",177.85]
];
var MAP = {};
for (var i=0;i<C.length;i++){ MAP[C[i][0]] = {code:C[i][0], name:C[i][1], flag:C[i][2], rate:C[i][3], order:i}; }
var ZERO_DEC = {JPY:1,KRW:1,VND:1,IDR:1,CLP:1,COP:1,HUF:1,ISK:1,PYG:1,KHR:1,LAK:1,MMK:1,UGX:1,TZS:1,RWF:1,GNF:1,BIF:1,IRR:1,LBP:1,UZS:1,ARS:1,VES:1,IQD:1,SOS:1,MWK:1,CRC:1,DJF:1,SDG:1};
var MAP = {};
for (var i=0;i<C.length;i++){ MAP[C[i][0]] = {code:C[i][0], name:C[i][1], flag:C[i][2], rate:C[i][3], order:i}; }

/* ============ saved settings ============ */
var LS = {
  get:function(k,d){ try{ var v=localStorage.getItem("cc."+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set:function(k,v){ try{ localStorage.setItem("cc."+k, JSON.stringify(v)); }catch(e){} }
};
var S = {
  pair: LS.get("pair",["JPY","ILS"]),
  recents: LS.get("recents",["JPY","ILS","USD","EUR"]),
  custom: LS.get("custom",{}),
  buzz: LS.get("buzz",true),
  active: 1,
  expr: "0"
};
if(!MAP[S.pair[0]]) S.pair[0]="USD";
if(!MAP[S.pair[1]]) S.pair[1]="EUR";

/* live = what we actually fetched.
   fetchedAt  = when THIS PHONE last got an answer
   publishedAt = when the provider last recalculated the rates (once a day)
   Keeping them apart is why the old build looked frozen: it showed the
   provider's daily stamp and called it the update time. */
var live = null;
(function(){
  var st = LS.get("live", null);
  if (st && st.rates && typeof st.rates.USD === "number"){
    live = {
      rates: st.rates,
      fetchedAt: st.fetchedAt || st.ts || 0,
      publishedAt: st.publishedAt || st.ts || null,
      src: st.src || "Exchange Rate API"
    };
  }
})();

/* ============ helpers ============ */
function $(s){ return document.querySelector(s); }
function perUsd(code){
  if (live && typeof live.rates[code] === "number" && live.rates[code] > 0) return live.rates[code];
  return MAP[code].rate;
}
function pairKey(a,b){ return a+">"+b; }
function rateOf(a,b){
  var c = S.custom[pairKey(a,b)];
  if (typeof c === "number" && c>0) return c;
  var c2 = S.custom[pairKey(b,a)];
  if (typeof c2 === "number" && c2>0) return 1/c2;
  return perUsd(b)/perUsd(a);
}
function isCustom(a,b){ return typeof S.custom[pairKey(a,b)]==="number" || typeof S.custom[pairKey(b,a)]==="number"; }

function fmt(v, code){
  if (v===null || !isFinite(v)) return "Error";
  var a = Math.abs(v), d;
  if (a===0) return "0";
  if (a < 0.0001) d = 8;
  else if (a < 0.01) d = 6;
  else if (a < 1) d = 4;
  else d = ZERO_DEC[code] ? 0 : 2;
  return v.toLocaleString("en-US",{maximumFractionDigits:d});
}
function fmtRate(v){
  if(!isFinite(v)) return "—";
  var a=Math.abs(v), d = a>=100?2 : a>=1?4 : a>=0.01?5 : 7;
  return v.toLocaleString("en-US",{maximumFractionDigits:d});
}
function groupExpr(e){
  return e.replace(/\d+(\.\d*)?/g, function(n){
    var p = n.split(".");
    var head = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return p.length>1 ? head+"."+p[1] : head;
  }).replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−");
}
function evalExpr(e){
  var toks = e.match(/(\d+\.?\d*|\.\d+|[+\-*\/])/g);
  if(!toks) return 0;
  while(toks.length && /[+\-*\/]/.test(toks[toks.length-1])) toks.pop();
  if(!toks.length) return 0;
  var vals=[parseFloat(toks[0])], ops=[];
  for(var i=1;i<toks.length;i+=2){
    if(toks[i+1]===undefined) break;
    ops.push(toks[i]); vals.push(parseFloat(toks[i+1]));
  }
  for(var j=0;j<ops.length;){
    if(ops[j]==="*"||ops[j]==="/"){
      var a=vals[j], b=vals[j+1];
      vals.splice(j,2, ops[j]==="*" ? a*b : a/b);
      ops.splice(j,1);
    } else j++;
  }
  var r=vals[0];
  for(var k=0;k<ops.length;k++){ r = ops[k]==="+" ? r+vals[k+1] : r-vals[k+1]; }
  return isFinite(r) ? r : null;
}
function ago(ts){
  if (!ts) return "never";
  var m = Math.floor((Date.now()-ts)/60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  var h = Math.floor(m/60);
  if (h < 24) return h + (h===1?" hour ago":" hours ago");
  var d = Math.floor(h/24);
  return d + (d===1?" day ago":" days ago");
}
function stamp(ts){
  if (!ts) return "unknown";
  try { return new Date(ts).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return new Date(ts).toISOString().slice(0,16).replace("T"," "); }
}

/* ============ vibration ============
   The old build asked for 8ms, which most phone motors are too slow to
   render at all. 18ms is the shortest pulse that reliably registers.     */
var canVibe = (typeof navigator.vibrate === "function");
var inFrame = (function(){ try { return window.top !== window.self; } catch(e){ return true; } })();
function buzz(ms){
  if (!S.buzz || !canVibe) return;
  try { navigator.vibrate(ms || 18); } catch(e){}
}
function buzzWhy(){
  if (!canVibe) return "This browser has no vibration support.";
  if (inFrame) return "Blocked inside an embedded preview. Works on your own site.";
  if (!S.buzz) return "Off.";
  return "On. If you feel nothing, check the phone's own haptic setting and that it isn't in silent mode.";
}

/* ============ render ============ */
var panels = [
  {cur:$('#pTop .cur'), val:$('#pTop .val'), num:$('#pTop .num'), flag:$('#pTop .flag'), code:$('#pTop .code'), el:$('#pTop')},
  {cur:$('#pBot .cur'), val:$('#pBot .val'), num:$('#pBot .num'), flag:$('#pBot .flag'), code:$('#pBot .code'), el:$('#pBot')}
];
function sizeClass(len){ return len<=9?"" : len<=12?"s2" : len<=16?"s3" : "s4"; }

function render(){
  var av = evalExpr(S.expr);
  for (var s=0;s<2;s++){
    var cc = S.pair[s], p = panels[s];
    p.flag.textContent = MAP[cc].flag;
    p.code.textContent = cc;
    p.el.classList.toggle("active", s === S.active);
    var txt, caret=false;
    if (s === S.active){
      txt = groupExpr(S.expr); caret = true;
      p.val.classList.remove("result");
    } else {
      txt = (av===null) ? "Error" : fmt(av * rateOf(S.pair[S.active], cc), cc);
      p.val.classList.add("result");
    }
    p.num.className = "num " + sizeClass(txt.length + (caret?1:0));
    p.num.textContent = txt;
    if (caret){ var b=document.createElement("span"); b.className="caret"; p.num.appendChild(b); }
  }
  var a = S.pair[0], b = S.pair[1];
  $("#rateLine").textContent = "1 " + b + " = " + fmtRate(rateOf(b,a)) + " " + a;
  renderAge();
}
function renderAge(){
  var box = $("#rateAge"), t = $("#ageText");
  box.className = "";
  if (isCustom(S.pair[0], S.pair[1])){ box.className = "custom"; t.textContent = "Your own rate"; return; }
  if (live && live.fetchedAt){
    var stale = (Date.now() - live.fetchedAt) > 3*86400000;
    box.className = stale ? "warn" : "live";
    t.textContent = "Checked " + ago(live.fetchedAt);
    return;
  }
  box.className = "warn";
  t.textContent = isLocalFile() ? "Local file \u00b7 rates of " + SNAP_LABEL
                                : "Built-in rates of " + SNAP_LABEL;
}

/* ============ keypad ============ */
function lastNumber(e){ var m = e.match(/(\d+\.?\d*|\.\d+)$/); return m?m[0]:null; }

function press(k){
  buzz();
  var e = S.expr;
  if (k === "C"){ S.expr = "0"; render(); return; }
  if (k === "back"){
    S.expr = e.length>1 ? e.slice(0,-1) : "0";
    if (S.expr === "") S.expr = "0";
    render(); return;
  }
  if (k === "swap"){ doSwap(); return; }
  if (k === "="){
    var v = evalExpr(e);
    S.expr = (v===null) ? "0" : String(Math.round(v*1e10)/1e10);
    render(); return;
  }
  if (k === "%"){
    var n = lastNumber(e);
    if (!n) return;
    var head = e.slice(0, e.length-n.length);
    var op = head.slice(-1), val = parseFloat(n)/100;
    if (op === "+" || op === "-"){
      var base = evalExpr(head.slice(0,-1));
      if (base !== null) val = base * val;
    }
    S.expr = head + String(Math.round(val*1e10)/1e10);
    render(); return;
  }
  if ("+-*/".indexOf(k) >= 0){
    S.expr = /[+\-*\/]$/.test(e) ? e.slice(0,-1) + k : e + k;
    render(); return;
  }
  if (k === "."){
    var cur = lastNumber(e);
    if (cur === null) S.expr = e + "0.";
    else if (cur.indexOf(".") === -1) S.expr = e + ".";
    render(); return;
  }
  if (e.length > 24) return;
  var lastN = lastNumber(e);
  S.expr = (lastN === "0") ? e.slice(0,-1) + k : e + k;
  render();
}
function doSwap(){
  S.pair = [S.pair[1], S.pair[0]];
  S.active = S.active === 0 ? 1 : 0;
  LS.set("pair", S.pair);
  render();
}

$("#keys").addEventListener("pointerdown", function(ev){
  var b = ev.target.closest(".k");
  if (!b) return;
  ev.preventDefault();
  press(b.getAttribute("data-k"));
});
$("#swapFab").addEventListener("pointerdown", function(ev){ ev.preventDefault(); buzz(22); doSwap(); });

for (var s2=0;s2<2;s2++){
  (function(idx){
    panels[idx].val.addEventListener("click", function(){
      if (S.active === idx) return;
      var v = evalExpr(S.expr);
      var conv = (v===null?0:v) * rateOf(S.pair[S.active], S.pair[idx]);
      S.active = idx;
      S.expr = String(Math.round(conv*1e6)/1e6);
      buzz(); render();
    });
    panels[idx].cur.addEventListener("click", function(){ buzz(); openPicker(idx); });
  })(s2);
}

/* ============ currency picker ============ */
var pickSlot = 0;
function pushRecent(code){
  S.recents = [code].concat(S.recents.filter(function(c){return c!==code;})).slice(0,6);
  LS.set("recents", S.recents);
}
function openPicker(slot){
  pickSlot = slot;
  $("#search").value = "";
  buildList("");
  $("#picker").classList.add("open");
  $("#list").scrollTop = 0;
}
function closePicker(){ $("#picker").classList.remove("open"); $("#search").blur(); }
function buildList(q){
  q = q.trim().toLowerCase();
  var pinned = {}, chosen = {};
  S.pair.forEach(function(c){ pinned[c]=1; chosen[c]=1; });
  S.recents.forEach(function(c){ pinned[c]=1; });
  var items = C.map(function(x){ return MAP[x[0]]; });
  if (q){
    items = items.filter(function(m){
      return m.code.toLowerCase().indexOf(q)>=0 || m.name.toLowerCase().indexOf(q)>=0;
    }).sort(function(x,y){
      var a = x.code.toLowerCase().indexOf(q)===0 ? 0:1, b = y.code.toLowerCase().indexOf(q)===0 ? 0:1;
      return a-b || x.order-y.order;
    });
  } else {
    var top = [], rest = [], seen = {};
    S.pair.concat(S.recents).forEach(function(c){ if(!seen[c] && MAP[c]){ seen[c]=1; top.push(MAP[c]); } });
    items.forEach(function(m){ if(!seen[m.code]) rest.push(m); });
    items = top.concat(rest);
  }
  var html = "";
  for (var i=0;i<items.length;i++){
    var m = items[i];
    html += '<button class="row'+(pinned[m.code]?' pinned':'')+(chosen[m.code]?' chosen':'')+'" data-code="'+m.code+'">'
          + '<span class="flag">'+m.flag+'</span>'
          + '<span class="name">'+m.name+'</span>'
          + '<span class="cc">'+m.code+'</span></button>';
  }
  if (!items.length) html = '<div class="empty">Nothing matches that. Try a code like JPY.</div>';
  $("#list").innerHTML = html;
}
$("#search").addEventListener("input", function(){ buildList(this.value); $("#list").scrollTop=0; });
$("#pickerBack").addEventListener("click", function(){ buzz(); closePicker(); });
$("#list").addEventListener("click", function(ev){
  var r = ev.target.closest(".row");
  if (!r) return;
  var code = r.getAttribute("data-code");
  var other = S.pair[pickSlot===0?1:0];
  if (code === other) S.pair = [S.pair[1], S.pair[0]];
  else S.pair[pickSlot] = code;
  pushRecent(code);
  LS.set("pair", S.pair);
  buzz(); closePicker(); render();
});

/* ============ sheet & dialogs ============ */
function openSheet(){
  $("#mUpdateSub").textContent = live
    ? "Checked " + ago(live.fetchedAt) + " \u00b7 rates published " + stamp(live.publishedAt)
    : "Never checked \u00b7 using the built-in rates of " + SNAP_LABEL;
  $("#mRateSub").textContent = isCustom(S.pair[0],S.pair[1])
    ? "Your own rate is in use for " + S.pair[1] + " \u2192 " + S.pair[0]
    : S.pair[1] + " \u2192 " + S.pair[0];
  $("#mBuzzSub").textContent = buzzWhy();
  $("#buzzToggle").classList.toggle("on", !!(S.buzz && canVibe));
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
}
function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); }
$("#menuBtn").addEventListener("click", function(){ buzz(); openSheet(); });
$("#scrim").addEventListener("click", function(){ closeSheet(); closeRateDlg(); });

$("#mBuzz").addEventListener("click", function(){
  if (!canVibe){ toast("This browser can't vibrate."); return; }
  S.buzz = !S.buzz; LS.set("buzz", S.buzz);
  $("#buzzToggle").classList.toggle("on", S.buzz);
  $("#mBuzzSub").textContent = buzzWhy();
  if (S.buzz){ try{ navigator.vibrate(40); }catch(e){} }   // so you can feel it straight away
});
$("#mCopy").addEventListener("click", function(){
  var other = S.pair[S.active===0?1:0];
  var v = evalExpr(S.expr);
  var txt = (v===null) ? "" : fmt(v*rateOf(S.pair[S.active], other), other);
  closeSheet();
  if (navigator.clipboard && txt){
    navigator.clipboard.writeText(txt).then(function(){ toast("Copied " + txt + " " + other); },
      function(){ toast("Could not copy here."); });
  } else toast("Could not copy here.");
});
$("#mUpdate").addEventListener("click", function(){ closeSheet(); updateRates(true); });
$("#refresh").addEventListener("click", function(){ buzz(); updateRates(true); });

function openRateDlg(){
  var a = S.pair[0], b = S.pair[1];
  $("#rateDlgTitle").textContent = "1 " + b + " in " + a;
  $("#rateDlgHint").textContent = "Type the rate your bank or the exchange desk gives you. It stays saved for this pair until you tap Market.";
  $("#rateInput").value = fmtRate(rateOf(b,a)).replace(/,/g,"");
  $("#scrim").classList.add("open"); $("#rateDlg").classList.add("open");
  setTimeout(function(){ $("#rateInput").focus(); $("#rateInput").select(); }, 60);
}
function closeRateDlg(){ $("#rateDlg").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#mRate").addEventListener("click", function(){ closeSheet(); openRateDlg(); });
$("#rateLine").parentNode.addEventListener("click", function(){ buzz(); openRateDlg(); });
$("#rateCancel").addEventListener("click", closeRateDlg);
$("#rateClear").addEventListener("click", function(){
  delete S.custom[pairKey(S.pair[1],S.pair[0])];
  delete S.custom[pairKey(S.pair[0],S.pair[1])];
  LS.set("custom", S.custom); closeRateDlg(); render(); toast("Back to market rates.");
});
$("#rateSave").addEventListener("click", function(){
  var v = parseFloat($("#rateInput").value.replace(/[^0-9.]/g,""));
  if (!isFinite(v) || v<=0){ toast("Enter a number bigger than zero."); return; }
  delete S.custom[pairKey(S.pair[0],S.pair[1])];
  S.custom[pairKey(S.pair[1],S.pair[0])] = v;
  LS.set("custom", S.custom); closeRateDlg(); render();
});

var toastTimer;
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 3000);
}

/* ============ live rates ============ */
var SOURCES = [
  {name:"Exchange Rate API", url:"https://open.er-api.com/v6/latest/USD", pick:function(j){
      if(!j || !j.rates) return null;
      return {rates:j.rates, publishedAt:(j.time_last_update_unix ? j.time_last_update_unix*1000 : null)};
  }},
  {name:"Frankfurter", url:"https://api.frankfurter.app/latest?from=USD", pick:function(j){
      if(!j || !j.rates) return null;
      var r = {}; for (var k in j.rates){ r[k] = j.rates[k]; } r.USD = 1;
      return {rates:r, publishedAt:(j.date ? Date.parse(j.date+"T00:00:00Z") : null)};
  }},
  {name:"Currency API", url:"https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json", pick:function(j){
      if(!j || !j.usd) return null;
      var r = {}; for (var k in j.usd){ r[k.toUpperCase()] = j.usd[k]; }
      return {rates:r, publishedAt:(j.date ? Date.parse(j.date+"T00:00:00Z") : null)};
  }}
];
function isLocalFile(){
  var p = location.protocol;
  return p === "file:" || p === "content:" || p === "blob:";
}
function failReason(){
  if (navigator.onLine === false) return "You're offline. Rates will update when you reconnect.";
  if (isLocalFile()) return "Updates are blocked because this page is a file on your phone, not a website. Put it online, or set the rate yourself.";
  return "No rate service answered. Your connection may be filtering them. Try again in a minute.";
}
function sane(out){
  if (!out || !out.rates) return false;
  var r = out.rates, n = 0;
  for (var k in r){ if (typeof r[k] === "number" && isFinite(r[k]) && r[k] > 0) n++; }
  return n > 20 && typeof r.ILS === "number" && r.ILS > 0 && typeof r.JPY === "number" && r.JPY > 0;
}

var updating = false, wantLoud = false;
function updateRates(loud){
  if (loud) wantLoud = true;
  if (updating) return;
  updating = true;
  $("#refreshIcon").classList.add("spin");
  var idx = 0;
  function step(){
    if (idx >= SOURCES.length){ finish(false); return; }
    var src = SOURCES[idx++], done = false;
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var to = setTimeout(function(){ if(ctl) try{ ctl.abort(); }catch(e){} }, 10000);
    fetch(src.url, {cache:"no-store", signal: ctl?ctl.signal:undefined})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status)); })
      .then(function(j){
        clearTimeout(to);
        var out = src.pick(j);
        if (!sane(out)) throw new Error("unusable answer");
        done = true;
        live = {
          rates: out.rates,
          fetchedAt: Date.now(),
          publishedAt: out.publishedAt || Date.now(),
          src: src.name
        };
        LS.set("live", live);
        finish(true);
      })
      .catch(function(){
        clearTimeout(to);
        if (!done) step();                       // that source failed, try the next
      });
  }
  function finish(ok){
    updating = false;
    var loudNow = wantLoud; wantLoud = false;
    $("#refreshIcon").classList.remove("spin");
    render();
    if (!loudNow) return;
    if (ok) toast("Rates updated from " + live.src + ".\nThey were published " + stamp(live.publishedAt) + ".");
    else toast(failReason());
  }
  step();
}

/* ============ boot ============ */
window.__androidBack = function(){
  if ($("#rateDlg").classList.contains("open")){ closeRateDlg(); return true; }
  if ($("#sheet").classList.contains("open")){ closeSheet(); return true; }
  if ($("#picker").classList.contains("open")){ closePicker(); return true; }
  return false;
};

$("#search").setAttribute("placeholder", "Search " + C.length + " currencies");
render();
updateRates(false);

document.addEventListener("visibilitychange", function(){
  if (!document.hidden){
    renderAge();
    if (!live || Date.now()-live.fetchedAt > 3600000) updateRates(false);
  }
});
window.addEventListener("online", function(){ updateRates(false); });
setInterval(renderAge, 30000);

document.addEventListener("keydown", function(ev){
  if ($("#picker").classList.contains("open") || $("#rateDlg").classList.contains("open")) return;
  var k = ev.key;
  if (/^[0-9]$/.test(k)) press(k);
  else if (k==="+"||k==="-"||k==="*"||k==="/") press(k);
  else if (k==="."||k===",") press(".");
  else if (k==="Enter"||k==="=") press("=");
  else if (k==="Backspace") press("back");
  else if (k==="Escape"||k==="c"||k==="C") press("C");
  else if (k==="%") press("%");
  else return;
  ev.preventDefault();
});

})();
</script>
